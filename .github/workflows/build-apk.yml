name: Build ShikshaSetu Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install All Dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Build Web Application Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Sync Web Assets to Android App
        working-directory: ./frontend
        run: |
          node -e "const fs = require('fs'); fs.cpSync('dist', 'android/app/src/main/assets/public', {recursive: true}); console.log('Copied dist to android assets');"

      - name: Make Gradlew Executable
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        id: build_apk
        working-directory: ./frontend/android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Inspect Gradle Log If Failed
        if: failure()
        working-directory: ./frontend/android
        run: |
          echo "==== GRADLE ERROR LOG TAIL ===="
          tail -n 120 gradle-build.log || true

      - name: Rename and Stage APK
        run: |
          mkdir -p build-artifacts
          echo "=== Scanning for built APK files ==="
          find . -name "*.apk" -ls
          
          # Target the primary debug APK produced by Gradle
          APK_FILE=$(find . -path "*/build/outputs/apk/*" -name "*debug*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Selected APK binary: $APK_FILE"
            cp -v "$APK_FILE" build-artifacts/ShikshaSetu-v1.0.0-debug.apk
          else
            echo "Error: No APK file was generated by the Gradle assemble task."
            exit 1
          fi
          
          echo "APK successfully staged:"
          ls -lh build-artifacts/ShikshaSetu-v1.0.0-debug.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaSetu-Android-APK
          path: build-artifacts/ShikshaSetu-v1.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "शिक्षासेतु (ShikshaSetu) v1.0.0 Android APK"
          body: |
            ### 📱 शिक्षासेतु (ShikshaSetu) v1.0.0 Android APK
            
            **Tagline:** करके सीखें, समझकर बढ़ें (Learn by Doing, Grow by Understanding)
            
            #### शामिल सुविधाएं (Features Included):
            - 🌟 **ऑफ़लाइन-प्रथम (Offline-First):** बिना इंटरनेट के भी संपूर्ण कार्यपत्रक व गतिविधियां काम करती हैं।
            - 💧 **जल संरक्षण 3-दिवसीय प्रायोगिक परियोजना:** कक्षा 6 के लिए अवलोकन, डेटा तालिका, बार चार्ट व समाधान।
            - 🔒 **सुरक्षित विद्यार्थी लॉगिन:** स्टूडेंट आईडी + 4-अंकीय पिन, नो ट्रैकिंग, नो ऐड्स।
            - 🏫 **कक्षा एवं शिक्षक मोड:** सिंगल डिवाइस क्लासरूम प्रोजेक्टर व प्रिंट कार्यपत्रक समर्थन।
            
            #### डाउनलोड एवं इंस्टॉल करने का तरीका:
            1. नीचे दिए गए **`ShikshaSetu-v1.0.0-debug.apk`** पर क्लिक करके अपने फोन में डाउनलोड करें।
            2. डाउनलोड होने के बाद फ़ाइल खोलें और **Install** दबाएं।
          files: build-artifacts/ShikshaSetu-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
